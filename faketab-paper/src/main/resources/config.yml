# ============================================================
#  FakeTabPreview — фейковые записи в табе и в пинге сервера.
#  Фейки — только записи в табе/пинге: не подключения, не сущности,
#  в Bukkit.getOnlinePlayers() не попадают.
# ============================================================

# Что включать сразу после запуска сервера:
#   off      — ничего, ждать команды;
#   percent  — как "/faketab on" (default-percent);
#   schedule — как "/faketab schedule" (суточный график ниже).
auto-start: "off"

# Сколько процентов от max-players заполнять командой "/faketab on".
# Реальные игроки вычитаются: цель = max * % - реальные (не меньше 0).
default-percent: 50.0

# Если цель выше этого числа — предупреждение в консоль (но команда выполняется).
warn-threshold: 500

# +--------------------------------------------------------------------------------+ #
# | ПОЯВЛЕНИЕ И УХОД                                                               | #
# +--------------------------------------------------------------------------------+ #
spawn:
  # Шаг выполняется раз в batch-interval-ticks (20 тиков = 1 секунда).
  batch-interval-ticks: 20
  # Максимум фейков, которые могут войти/выйти за один шаг.
  batch-size: 2
  # Шанс (0.01–1.0), что каждый из batch-size «слотов» сработает на этом шаге.
  # Меньше — фейки заходят и выходят реже и неравномернее, больше — быстрее.
  # Пример: batch-size 2, join-chance 0.35 → в среднем ~0.7 входа в секунду, иногда 0, иногда 2.
  join-chance: 0.35
  leave-chance: 0.35
  # В режимах "on" / "fill" / "schedule" пересчитывать цель при входе/выходе реальных игроков.
  percent-tracks-real-players: true

# Сколько фейк «сидит» на сервере, прежде чем выйти. На его место потом
# так же постепенно заходит новый фейк с другим ником — как обычный вход/выход игроков.
connection-period:
  enabled: true
  min-minutes: 5
  max-minutes: 25

schedule:
  # Режим "/faketab schedule": процент слотов меняется по времени суток.
  # Часовой пояс графика: "system" (как у сервера) или, например, "Europe/Moscow", "Europe/Kyiv".
  timezone: "system"
  # Как часто пересчитывать цель, секунды (минимум 5).
  check-interval-seconds: 60
  # Случайный разброс ± к проценту при каждом пересчёте, чтобы онлайн «дышал».
  jitter-percent: 2.0
  # Точки графика: "ЧЧ:ММ" (обязательно в кавычках) → % от max-players.
  # Между точками процент меняется плавно (линейно), после последней точки — плавно к первой.
  # Реальные игроки вычитаются так же, как в "fill".
  points:
    "00:00": 35
    "03:00": 15
    "06:00": 8
    "09:00": 15
    "12:00": 30
    "15:00": 45
    "18:00": 65
    "20:30": 85
    "22:00": 70

rotation:
  # Замена сразу пачки фейков раз в интервал. Обычно не нужна, если включён connection-period.
  enabled: false
  # Базовый интервал между ротациями, секунды.
  interval-seconds: 90
  # Случайный разброс ± к интервалу, секунды.
  jitter-seconds: 30
  # Какая доля фейков заменяется за раз (0.0–1.0). Минимум 1 запись.
  fraction: 0.1

entry:
  # Пинг фейков в мс: случайно в диапазоне [min; max]. Для фиксированного — одинаковые значения.
  latency:
    min: 25
    max: 140
  # Режим игры в табе: SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR
  # (SPECTATOR — серый курсив внизу списка).
  gamemode: SURVIVAL
  # Показывать второй слой скина (шляпу).
  show-hat: true

# +--------------------------------------------------------------------------------+ #
# | ГРУППЫ (РАНГИ) В ТАБЕ                                                          | #
# +--------------------------------------------------------------------------------+ #
groups:
  # Группа, которую получают все новые фейки.
  default-group: default

  # Редкие случайные группы: с шансом chance новый фейк получает одну из list
  # (какую именно — по weight из groups.list). 0.08 = примерно каждый 12-й.
  # list можно писать списком или строкой "silver;platina".
  random-groups:
    chance: 0.08
    list: [silver, platina]

  # Если стоит LuckPerms — брать префикс из одноимённой группы LuckPerms.
  # Нет такой группы в LP — используется format ниже.
  # Префиксы LP с &-кодами (&7, &#ff8800) понимаются как legacy, иначе как MiniMessage.
  use-luckperms: true

  # format — MiniMessage (градиенты, hex), <name> — ник.
  # weight — вес среди random-groups (silver выпадает в 3 раза чаще platina).
  # order  — порядок в табе: больше — выше. У реальных игроков 0, поэтому отрицательные
  #          значения ставят фейков ПОСЛЕ всех реальных игроков (и не выше админов при плагине TAB).
  list:
    default:
      format: "<gray><name>"
      order: -30
    silver:
      format: "<#c0c0c0>[Silver]</#c0c0c0> <white><name>"
      weight: 3
      order: -20
    platina:
      format: "<gradient:#e5e4e2:#7fd3ff>[Platina]</gradient> <white><name>"
      weight: 1
      order: -10

names:
  # Шанс взять базовый ник без вариаций (если он свободен).
  plain-chance: 0.35
  # Пул базовых ников (3–16 символов, A-Z a-z 0-9 _). Из них генерируются вариации
  # с суффиксами (Steve_42, xSteve x, Steve2011...). Повторов среди активных нет.
  base:
    - Steve
    - Alex
    - DarkKnight
    - Pixel
    - Shadow
    - Frosty
    - Creeper
    - NightOwl
    - Blaze
    - Kitsune
    - Zephyr
    - Nova
    - Raven
    - Lucky
    - Toxic
    - Sakura
    - Ghost
    - Wolfie
    - Mango
    - Vortex
    - Hunter
    - Panda
    - Storm
    - Neko
    - Viper
    - Bandit
    - Comet
    - Ember
    - Kirito
    - Miner
    - Crafty
    - Banana
    - Rocket
    - Sniper
    - Glitch
    - Senpai
    - Potato
    - Phantom
    - Lime
    - Ozzy

ping:
  # Добавлять фейков в player sample (наведение на пинг в списке серверов).
  enabled: true
  # Сколько ников показывать в сэмпле всего (вместе с реальными игроками).
  sample-size: 12
  # Прибавлять число фейков к онлайну в пинге.
  add-to-count: false
