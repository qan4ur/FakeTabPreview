# ============================================================
#  FakeTabPreview (Velocity): подставляет фейковый player sample
#  backend-сервера в пинг прокси.
# ============================================================

# Имя backend-сервера из velocity.toml, с которого брать player sample.
backend=lobby

# Как часто пинговать backend, секунды.
sync-interval-seconds=10

# Сколько ников показывать в сэмпле всего.
sample-size=12

# Прибавлять фейков к онлайну прокси. Число фейков = онлайн backend - реальные игроки на нём,
# поэтому на Paper нужно включить ping.add-to-count.
add-to-count=false
